<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>x2x5</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card-bg: #ffffff;
      --text: #1d2433;
      --muted: #5f687a;
      --border: #e5e9f2;
      --shadow: 0 10px 30px rgba(20, 34, 66, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11141b;
        --card-bg: #1a1f2b;
        --text: #eef2ff;
        --muted: #a3adc2;
        --border: #2a3142;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: block;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    main {
      width: min(960px, 100%);
      position: relative;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .lang-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text);
      border-color: #7f9ae9;
    }

    .lang-btn.active {
      color: #fff;
      background: #365fcf;
      border-color: #365fcf;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
    }

    .cards {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(43, 80, 169, 0.16);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .section-label {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin: 28px 0 10px;
    }

    .cards--supervisors {
      grid-template-columns: 1fr;
    }

    .layout {
      display: flex;
      gap: 0;
      align-items: flex-start;
    }

    .layout-left {
      flex: 1;
      min-width: 0;
    }

    .layout-divider {
      width: 1px;
      align-self: stretch;
      background: var(--border);
      margin: 0 24px;
      flex-shrink: 0;
    }

    .layout-right {
      width: 240px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1 data-i18n="title">x2x5 Research</h1>
      <div class="toolbar">
        <button class="lang-btn active" data-lang="zh" type="button">中文</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
      </div>
    </div>
    <div class="layout">
      <div class="layout-left">
        <p class="section-label" data-i18n="toolsLabel">工具</p>
        <section class="cards">
          <a class="card" href="https://x2x5.top/find">
            <h2 data-i18n="findTitle">Find</h2>
            <p data-i18n="findDesc">paper search website</p>
          </a>
          <a class="card" href="https://x2x5.top/write">
            <h2 data-i18n="writeTitle">Write</h2>
            <p data-i18n="writeDesc">skills for write paper</p>
          </a>
          <a class="card" href="https://x2x5.top/blog/">
            <h2 data-i18n="blogTitle">Blog</h2>
            <p data-i18n="blogDesc">thoughts & insights</p>
          </a>
          <a class="card" href="https://x2x5.top/ccf">
            <h2 data-i18n="ccfTitle">CCF</h2>
            <p data-i18n="ccfDesc">CCF recommended level</p>
          </a>
        </section>
      </div>
      <div class="layout-divider"></div>
      <div class="layout-right">
        <p class="section-label" data-i18n="supervisorsLabel">导师</p>
        <section class="cards cards--supervisors">
          <a class="card" href="https://x2x5.top/lyy">
            <h2 data-i18n="supervisorTitle">骆昱宇</h2>
            <p data-i18n="supervisorDesc">Professor, HKUST(GZ)</p>
          </a>
          <a class="card" href="https://x2x5.top/cardz/">
            <h2 data-i18n="selfTitle">卡子</h2>
            <p data-i18n="selfDesc">description</p>
          </a>
        </section>
      </div>
    </div>
  </main>
  <script>
    const I18N = {
      zh: {
        title: "x2x5 Research",
        writeTitle: "Write",
        writeDesc: "写论文的技能",
        supervisorTitle: "骆昱宇",
        supervisorDesc: "港科广助理教授",
        findTitle: "Find",
        findDesc: "检索顶会论文",
        blogTitle: "Blog",
        blogDesc: "经验 & 思考",
        ccfTitle: "CCF",
        ccfDesc: "CCF 等级查询",
        toolsLabel: "工具",
        supervisorsLabel: "导师",
        selfTitle: "卡子",
        selfDesc: "野鸡大学副教授"
      },
      en: {
        title: "x2x5 Research",
        writeTitle: "Write",
        writeDesc: "skills for write paper",
        supervisorTitle: "Yuyu Luo",
        supervisorDesc: "Professor, HKUST(GZ)",
        findTitle: "Find",
        findDesc: "retrieval for top papers",
        blogTitle: "Blog",
        blogDesc: "experience & thoughts",
        ccfTitle: "CCF",
        ccfDesc: "CCF recommended level",
        toolsLabel: "Tools",
        supervisorsLabel: "Supervisors",
        selfTitle: "Cardz",
        selfDesc: "Professor, WCU"
      }
    };

    const langButtons = document.querySelectorAll(".lang-btn");
    const i18nNodes = document.querySelectorAll("[data-i18n]");
    const defaultLang = "zh";

    function setLanguage(lang) {
      const dict = I18N[lang] || I18N.en;
      i18nNodes.forEach((node) => {
        const key = node.dataset.i18n;
        if (dict[key]) node.textContent = dict[key];
      });
      langButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      document.documentElement.lang = lang;
      localStorage.setItem("lang", lang);
    }

    langButtons.forEach((btn) => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    setLanguage(localStorage.getItem("lang") || defaultLang);
  </script>
</body>
</html>
